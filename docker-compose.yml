version: "3.9"
services:
  # 🐹 Service Redis untuk Buffer Stream
  redis-dev:
    image: redis:7.2-alpine
    container_name: redis-dev
    command: redis-server --appendonly yes --requirepass rahasiaredisdev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - dev-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "rahasiaredisdev", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # 🌐 Service HTTP
  worker-exporter-http:
    build:
      dockerfile: Dockerfile
      context: .
    container_name: worker-exporter-http
    command: ["./http"]
    env_file:
      - .env.production
    ports:
      - "9090:8089"
    networks:
      - dev-network
    depends_on:
      redis-dev:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g
        reservations:
          cpus: "1"
          memory: 256m

  # 🦀 Service Worker Consumer (Stream Redis)
  worker-exporter-consumer:
    build:
      dockerfile: Dockerfile
      context: .
    container_name: worker-exporter-consumer
    command: ["./worker"]
    env_file:
      - .env.production
    networks:
      - dev-network
    depends_on:
      redis-dev:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g
        reservations:
          cpus: "0.5"
          memory: 256m

networks:
  dev-network:
    driver: bridge
volumes:
  redis_data:
    driver: local
