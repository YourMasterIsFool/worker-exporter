
[package]
name = "export_rust"
version = "0.1.0"
edition = "2021"
authors = ["verrandyb@gmail.com"]
description = "Rust export service"

[dependencies]
# Stable versions untuk compatibility
axum = "0.7.0"
csv = "1.3.0"
tokio = { version = "1.40.0", features = ["full"] }
sqlx = { version = "0.8", features = ["macros","mysql", "postgres", "runtime-tokio", "tls-rustls", "migrate", "uuid", "chrono", "json"] }
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4.35", default-features = false, features = ["serde"] }
urlencoding = "2.1.3"
rust_xlsxwriter = { version = "0.90.0", features = ["constant_memory"] }
dotenv = "0.15.0"
tera = "1.19.0"
lettre = "0.11.0"
rust-s3 = "0.35.0"
once_cell = "1.19.0"
tokio-util = "0.7.12"
tracing = "0.1"
tracing-subscriber = { version="0.3", features =['env-filter', 'fmt']}
tracing-tracy = "0.11"
tracy-client = { version = "0.17", features = ["enable", "system-tracing"] }
serde_json = "1.0"
async-trait = "0.1"
anyhow = "1.0.102"
thiserror = "2.0.18"
strum_macros = "0.28.0"
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }
watch = "0.2.3"
excelstream = "0.20.2"

# UUID with stable version
[dependencies.uuid]
version = "1.10.0"
features = ["v4", "serde"]

# HAPUS INI (tidak perlu):
# [dependencies.reqwest]
# [dependencies.native-tls]
# [features]


[profile.release]
debug = true
