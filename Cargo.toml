[package]
name = "worker-exporter"
version = "0.1.0"
edition = "2021"
authors = ["verrandyb@gmail.com"]
description = "Rust export service"

[features]
default = []
dhat-heap = ["dep:dhat"]
jemalloc = ["dep:tikv-jemallocator"]
tracy = ["dep:tracing-tracy", "dep:tracy-client"]

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1"
axum = "0.7.0"
bigdecimal = { version = "0.4", features = ["serde"] }
calamine = "0.26"
csv = "1.3.0"
dotenv = "0.15.0"
excelstream = "0.20.2"
futures-util = "0.3"
moka = { version = "0.12", features = ["future"] }
once_cell = "1.19.0"
prost = "0.12"
serde_json = "1.0"
strum_macros = "0.28.0"
thiserror = "2.0.18"
tokio-util = "0.7.12"
tracing = "0.1"
urlencoding = "2.1.3"
watch = "0.2.3"

reqwest = { version = "0.11", default-features = false, features = ["stream", "json", "rustls-tls"] }

redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }

rust_xlsxwriter = { version = "0.90.0", features = ["constant_memory"] }

serde = { version = "1.0", features = ["derive"] }

sqlx = { version = "0.8", default-features = false, features = [
    "macros",
    "mysql",
    "postgres",
    "runtime-tokio",
    "tls-rustls",
    "migrate",
    "uuid",
    "chrono",
    "json",
    "bigdecimal",
] }

tokio = { version = "1.40.0", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "sync",
    "time",
    "fs",
    "io-util",
    "net",
] }

tonic = { version = "0.11.0", features = ["transport", "codegen"] }

tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

uuid = { version = "1.10.0", features = ["v7", "serde"] }

chrono = { version = "0.4.35", default-features = false, features = ["serde", "clock"] }

dhat = { version = "0.3", optional = true }

tikv-jemallocator = { version = "0.6", optional = true }

tracing-tracy = { version = "0.11", optional = true }

tracy-client = { version = "0.17", optional = true, features = ["enable", "system-tracing"] }

[build-dependencies]
tonic-build = "0.11"

[profile.dev]
debug = 1
incremental = true

[profile.dev.package."*"]
debug = false

[profile.release]
debug = false
strip = "symbols"
incremental = false
lto = false
codegen-units = 16
panic = "abort"