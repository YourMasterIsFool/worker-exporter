
[package]
name = "worker-exporter"
version = "0.1.0"
edition = "2021"
authors = ["verrandyb@gmail.com"]
description = "Rust export service"


[features]
# Daftarkan feature di sini agar bisa diaktifkan lewat --features
dhat-heap = []

[dependencies]
moka = { version = "0.12", features = ["future"] }
calamine = "0.26"
dhat = "0.3"
tikv-jemallocator = "0.6"
# Stable versions untuk compatibility
axum = "0.7.0"
bigdecimal = { version= "0.4", features = ["serde"]}
reqwest = { version = "0.11", features = ["stream", "json"] }
futures-util = "0.3"
csv = "1.3.0"
tokio = { version = "1.40.0", features = ["full"] }
sqlx = { version = "0.8", features = ["macros","mysql", "postgres", "runtime-tokio", "tls-rustls", "migrate", "uuid", "chrono", "json", "bigdecimal"] }
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4.35", default-features = false, features = ["serde"] }
urlencoding = "2.1.3"
rust_xlsxwriter = { version = "0.90.0", features = ["constant_memory"] }
dotenv = "0.15.0"
once_cell = "1.19.0"
tokio-util = "0.7.12"
tracing = "0.1"
tracing-subscriber = { version="0.3", features =['env-filter', 'fmt']}
tracing-tracy = "0.11"
tracy-client = { version = "0.17", features = ["enable", "system-tracing"] }
serde_json = "1.0"
async-trait = "0.1"
anyhow = "1.0.102"
thiserror = "2.0.18"
strum_macros = "0.28.0"
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }
watch = "0.2.3"
excelstream = "0.20.2"
tonic = { version = "0.11.0", features = ["transport", "codegen"] }
prost = "0.12"



[build-dependencies]
tonic-build = "0.11"
# UUID with stable version
[dependencies.uuid]
version = "1.10.0"
features = ["v7", "serde", "js"] # Tambahkan 'v7' di sini

# HAPUS INI (tidak perlu):
# [dependencies.reqwest]
# [dependencies.native-tls]
# [features]


[profile.release]
debug = true
