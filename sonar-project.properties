# ============================================
# SonarQube Configuration for Rust Project
# ============================================
# Copy this file to your project root as: sonar-project.properties
# Update the values according to your project

# Project identification
# Variables will be replaced by pipeline: ${TENANT_NAME}, ${SERVICE_NAME}
sonar.projectKey=${TENANT_NAME}-${SERVICE_NAME}
sonar.projectName=${TENANT_NAME} ${SERVICE_NAME}
sonar.projectVersion=1.0

# Source code location
sonar.sources=src
sonar.tests=tests

# Exclusions
sonar.exclusions=target/**,**/*.rs.bk

# Language
sonar.language=rust

# Encoding
sonar.sourceEncoding=UTF-8

# Note: SonarQube Rust support requires community plugin
# Install: https://github.com/elegoff/sonar-rust
